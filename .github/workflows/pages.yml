name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'examples/demo/**'
      - 'skill/renderer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare demo artifact
        run: |
          mkdir --parents _site/en _site/zh-CN
          cp examples/demo/landing.html _site/index.html
          cp examples/demo/expected-output.html _site/en/index.html
          cp examples/demo/expected-output.zh-CN.html _site/zh-CN/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
