name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 20 core validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mapspec
      - run: npm run test:build
      - run: npm run ajv:strict -- examples/demo/expected-mapspec.json examples/demo/expected-mapspec.zh-CN.json
